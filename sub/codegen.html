<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>날짜별 Code 생성기</title>
<style>
  :root{
    --bg:#f3f1ec; --panel:#ffffff; --ink:#1c1c1a; --sub:#6b685f;
    --line:#dcd8cd; --accent:#2f5d50; --accent-ink:#ffffff;
    --mono-bg:#1c1c1a; --mono-ink:#e8e4d8; --warn:#9a6a2a;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#15140f; --panel:#201f19; --ink:#efece2; --sub:#a39d8c;
      --line:#38362c; --accent:#6fb79a; --accent-ink:#0e1210;
      --mono-bg:#0d0d0a; --mono-ink:#dcd6c2; --warn:#d9a564;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#15140f; --panel:#201f19; --ink:#efece2; --sub:#a39d8c;
    --line:#38362c; --accent:#6fb79a; --accent-ink:#0e1210;
    --mono-bg:#0d0d0a; --mono-ink:#dcd6c2; --warn:#d9a564;
    color-scheme: dark;
  }
  *{box-sizing:border-box;}
  html{scroll-padding-top:env(safe-area-inset-top,0px);}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family: ui-sans-serif, "Pretendard", "Apple SD Gothic Neo", "Noto Sans KR", system-ui, sans-serif;
    padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
    min-height:100%;
  }
  .wrap{max-width:560px; margin:0 auto; padding:40px 20px 64px;}
  h1{font-size:1.35rem; font-weight:700; margin:0 0 6px; letter-spacing:-0.01em;}
  .lede{color:var(--sub); font-size:0.92rem; margin:0 0 28px; line-height:1.5;}
  .panel{
    background:var(--panel); border:1px solid var(--line); border-radius:14px;
    padding:22px; margin-bottom:18px;
  }
  .row{display:flex; gap:10px; margin-bottom:14px;}
  .field{flex:1; display:flex; flex-direction:column; gap:6px;}
  .field.year{flex:1.3;}
  label{font-size:0.78rem; color:var(--sub); font-weight:600;}
  select, input{
    font-family:inherit; font-size:1rem; padding:10px 10px; border-radius:9px;
    border:1px solid var(--line); background:var(--bg); color:var(--ink);
  }
  select:focus, input:focus{outline:2px solid var(--accent); outline-offset:1px;}
  button{
    width:100%; padding:13px; border:none; border-radius:9px; cursor:pointer;
    background:var(--accent); color:var(--accent-ink); font-size:1rem; font-weight:700;
    font-family:inherit; margin-top:4px;
  }
  button:active{transform: translateY(1px);}
  .result{
    margin-top:18px; padding:18px; border-radius:11px; background:var(--mono-bg);
    display:none;
  }
  .result.show{display:block;}
  .result .code{
    font-family: "SF Mono","JetBrains Mono",ui-monospace,Consolas,monospace;
    font-size:2.1rem; letter-spacing:0.12em; color:var(--mono-ink); font-weight:700;
  }
  .result .meta{color:var(--mono-ink); opacity:0.65; font-size:0.78rem; margin-top:8px; line-height:1.5;}
  .badge{
    display:inline-block; font-size:0.7rem; font-weight:700; padding:2px 8px;
    border-radius:999px; margin-right:6px;
  }
  .badge.ok{background:#2f5d5022; color:var(--accent);}
  .badge.approx{background:#9a6a2a22; color:var(--warn);}
  .error{color:#b3523f; font-size:0.85rem; margin-top:10px; display:none;}
  .error.show{display:block;}
  .note{color:var(--sub); font-size:0.78rem; line-height:1.6; margin-top:24px;}
  .copy-btn{
    width:auto; display:inline-flex; align-items:center; gap:6px; margin-top:12px;
    padding:7px 14px; font-size:0.82rem; font-weight:600;
    background:transparent; border:1px solid var(--mono-ink); color:var(--mono-ink);
    opacity:0.85;
  }
  .copy-btn:hover{opacity:1;}
  .copy-btn.copied{background:var(--mono-ink); color:var(--mono-bg); border-color:var(--mono-ink);}

</style>
</head>
<body>
<div class="wrap">
  <h1>날짜별 Code 생성기</h1>
  <p class="lede">연·월·일을 입력하면 2019년 기준 Code 조회표와 연도별 변환식을 적용해 6자리 Code를 계산합니다. 2019~2030년만 지원합니다.</p>

  <div class="panel">
    <div class="row">
      <div class="field year">
        <label for="year">연도</label>
        <select id="year"></select>
      </div>
      <div class="field">
        <label for="month">월</label>
        <select id="month"></select>
      </div>
      <div class="field">
        <label for="day">일</label>
        <select id="day"></select>
      </div>
    </div>
    <div class="error" id="err"></div>
    <div class="result" id="result">
      <div class="code" id="codeOut">------</div>
      <div class="meta" id="metaOut"></div>
      <button class="copy-btn" id="copyBtn">코드 복사</button>
    </div>
    <button id="go">Code 생성</button>
  </div>

  <p class="note">2019년 365일치 실측 Code를 기준으로, 연도별로 역산한 자리별 보정식을 적용합니다. 2019~2030년 전 연도가 실측 샘플로 100% 검증된 상태입니다.</p>
</div>

function digits(code){ return code.split('').map(Number); }
function j(arr){ return arr.map(n => ((n%10)+10)%10).join(''); }

// 각 연도 변환 함수: 2019년 기준 코드(문자열) -> 해당 연도 코드(문자열)
const CONVERTERS = {
  2019: (c)=> c,
  2020: (c)=>{ const [a,b,cc,d,e,f]=digits(c); const de=10*d+e;
    const R=(e>=9)||(e==8&&a>=3), S=a>=3, T=de>=78;
    return j([a+7,b,cc,d+2+(R?1:0),e+1+(S?1:0),f+(T?1:0)]); },
  2021: (c)=>{ const [a,b,cc,d,e,f]=digits(c);
    const P=cc>=2, R=(e==9 && d%2==1), S=a>=8;
    return j([a+1+(P?1:0),b,cc+8,d+1+(R?1:0),e+(S?1:0),f+1]); },
  2022: (c)=>{ const [a,b,cc,d,e,f]=digits(c);
    const P=cc>=7, Q=f>=6, Dcond=d>=3;
    return j([a+8+(P?1:0),b+(Q?1:0),cc+3,d+7+(Dcond?1:0),e+8+(a>=1?1:0),f+3+(Dcond?1:0)]); },

  2024: (c)=>{ const [a,b,cc,d,e,f]=digits(c); const de=10*d+e;
    const P=cc>=5, Q=(f>=6||de>=90), R=e>=7, S=a>=6, T=de>=90;
    return j([a+4+(P?1:0),b+(Q?1:0),cc+5,d+1+(R?1:0),e+2+(S?1:0),f+4+(T?1:0)]); },
  2025: (c)=>{ const [a,b,cc,d,e,f]=digits(c);
    const P=cc>=4, R=(e>=7)||(e==5&&d>=6), S=(a==9)&&(cc>=8||d>=6);
    return j([a+(P?1:0),b,cc+7,d+9+(R?1:0),e+4+(S?1:0),f+2+(d>=1?1:0)]); },
  2026: (c)=>{ const [a,b,cc,d,e,f]=digits(c); const de=10*d+e;
    const P=cc>=7, Q=f>=7, R=e>=7, S=a>=8, T=de>=77;
    return j([a+2+(P?1:0),b+(Q?1:0),cc+3,d+2+(R?1:0),e+3+(S?1:0),f+3+(T?1:0)]); },
  2027: (c)=>{ const [a,b,cc,d,e,f]=digits(c); const de=10*d+e;
    const P=cc>=8;
    const Q=(f>=6)||(f==5&&de>=56);
    const R=(e>=7)||(e==6&&a>=6);
    const S=(a>=6)||(a==5&&cc>=8);
    const T=(de>56)||(de==56&&a>=6);
    return j([a+4+(P?1:0),b+(Q?1:0),cc+2,d+4+(R?1:0),e+3+(S?1:0),f+4+(T?1:0)]); },
  2028: (c)=>{ const [a,b,cc,d,e,f]=digits(c);
    const P=cc>=8, R=e>=5, S=(a>=8)||(a==7&&cc==9), T=(d==9&&e==9);
    return j([a+2+(P?1:0),b,cc+2,d+(R?1:0),e+5+(S?1:0),f+2+(T?1:0)]); },
  2029: (c)=>{ const [a,b,cc,d,e,f]=digits(c); const de=10*d+e;
    const R=e>=6, S=a>=5, T=de>=59;
    return j([a+5,b,cc,d+4+(R?1:0),e+4+(S?1:0),f+(T?1:0)]); },
  2030: (c)=>{ const [a,b,cc,d,e,f]=digits(c);
    const R=e>=3, S=a>=8, Dcond=d>=3;
    return j([a+2,b,cc,d+6+(R?1:0),e+6+(S?1:0),f+(Dcond?1:0)]); },

function getCode(year, month, day){
  const key = String(month).padStart(2,'0') + '-' + String(day).padStart(2,'0');
  const base = LOOKUP_2019[key];
  if (!base) return { error: '해당 날짜의 2019년 기준 Code를 찾을 수 없습니다.' };
  const fn = CONVERTERS[year];
  if (!fn) return { error: '2019~2030년만 지원합니다.' };
  return { code: fn(base), base };
}

function copyToClipboard(text, btn){
  const done = ()=>{
    const original = btn.dataset.label || btn.textContent;
    btn.dataset.label = original;
    btn.textContent = '복사됨 ✓';
    btn.classList.add('copied');
    setTimeout(()=>{ btn.textContent = original; btn.classList.remove('copied'); }, 1500);
  };
  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done).catch(()=>{
      btn.textContent = '복사 실패'; setTimeout(()=>{ btn.textContent = btn.dataset.label || '코드 복사'; }, 1500);
    });
  } else {
    try{
      const ta = document.createElement('textarea');
      ta.value = text; ta.style.position='fixed'; ta.style.opacity='0';
      document.body.appendChild(ta); ta.select();
      document.execCommand('copy'); document.body.removeChild(ta);
      done();
    }catch(e){
      btn.textContent = '복사 실패'; setTimeout(()=>{ btn.textContent = btn.dataset.label || '코드 복사'; }, 1500);
    }
  }
}

  monthSel.appendChild(o);
}
function daysInMonth(m){ return [31,28,31,30,31,30,31,31,30,31,30,31][m-1]; }
function rebuildDays(){
  const m = parseInt(monthSel.value,10);
  const cur = parseInt(daySel.value,10) || 1;
  daySel.innerHTML = '';
  const n = daysInMonth(m);
  for (let d=1; d<=n; d++){
    const o=document.createElement('option'); o.value=d; o.textContent=d+'일';
    daySel.appendChild(o);
  }
  daySel.value = Math.min(cur, n);
}
monthSel.addEventListener('change', rebuildDays);

const today = new Date();
const todayY = today.getFullYear(), todayM = today.getMonth()+1, todayD = today.getDate();
yearSel.value = (todayY>=2019 && todayY<=2030) ? todayY : 2019;
monthSel.value = todayM;
rebuildDays();
daySel.value = todayD;

let currentCode = '';
document.getElementById('go').addEventListener('click', ()=>{
  errBox.classList.remove('show');
  resultBox.classList.remove('show');
  const year = parseInt(yearSel.value,10);
  const month = parseInt(monthSel.value,10);
  const day = parseInt(daySel.value,10);
  const r = getCode(year, month, day);
  if (r.error){ errBox.textContent = r.error; errBox.classList.add('show'); return; }
  currentCode = r.code;
  codeOut.textContent = r.code;
  const conf = CONFIDENCE[year];
  const badgeClass = conf.ok ? 'ok' : 'approx';
  metaOut.innerHTML = '<span class="badge '+badgeClass+'">'+conf.label+'</span>' + year + '년 ' + month + '월 ' + day + '일 · 2019년 기준 Code: ' + r.base;
  resultBox.classList.add('show');
});

document.getElementById('copyBtn').addEventListener('click', (e)=>{
  if (currentCode) copyToClipboard(currentCode, e.currentTarget);
});
</script>
</body>
</html>
