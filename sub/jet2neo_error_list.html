<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JET2neo Error List</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f5f3; color: #1a1a19; font-size: 14px; }

  .container { max-width: 1380px; margin: 0 auto; padding: 2rem 1.5rem 6rem; }

  h1 { font-size: 22px; font-weight: 500; margin-bottom: 0.25rem; }
  .subtitle { font-size: 13px; color: #888780; margin-bottom: 1.5rem; }

  .top-bar { display: flex; gap: 10px; align-items: center; margin-bottom: 1rem; }
  .search-box {
    flex: 1; padding: 9px 14px; font-size: 14px;
    border: 0.5px solid #c8c6be; border-radius: 8px;
    background: #fff; color: #1a1a19;
    outline: none; transition: border-color 0.15s;
  }
  .search-box:focus { border-color: #888780; }

  .btn-sm {
    white-space: nowrap; padding: 8px 14px; font-size: 12px; font-weight: 500;
    border-radius: 8px; border: 0.5px solid #c8c6be;
    background: #fff; color: #5f5e5a; cursor: pointer; transition: all 0.15s;
  }
  .btn-sm:hover { background: #f1efe8; }

  .filters { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 0.75rem; }
  .filter-btn {
    font-size: 12px; padding: 4px 12px; border-radius: 8px;
    border: 0.5px solid #c8c6be; background: #fff;
    color: #5f5e5a; cursor: pointer; transition: all 0.15s;
  }
  .filter-btn:hover { background: #f1efe8; }
  .filter-btn.active { background: #f1efe8; color: #1a1a19; border-color: #888780; font-weight: 500; }

  .count { font-size: 12px; color: #888780; margin-bottom: 8px; }

  /* checked-only mode banner */
  .mode-banner {
    display: none; align-items: center; justify-content: space-between;
    background: #faeeda; border: 0.5px solid #ef9f27;
    border-radius: 8px; padding: 8px 14px; margin-bottom: 10px; font-size: 13px; color: #633806;
  }
  .mode-banner.visible { display: flex; }
  .btn-reset-view {
    font-size: 12px; font-weight: 500; color: #633806; background: none;
    border: 0.5px solid #ba7517; border-radius: 6px; padding: 4px 12px; cursor: pointer;
  }
  .btn-reset-view:hover { background: #fac775; }

  .tbl-wrap { overflow-x: auto; border-radius: 10px; border: 0.5px solid #d3d1c7; }

  table { width: 100%; border-collapse: collapse; font-size: 13px; background: #fff; }

  thead th {
    text-align: left; padding: 10px 12px;
    font-weight: 500; font-size: 12px; color: #5f5e5a;
    border-bottom: 0.5px solid #d3d1c7;
    background: #f1efe8; position: sticky; top: 0; z-index: 1;
  }
  th.col-chk, td.col-chk { width: 40px; text-align: center; padding: 10px 6px; }
  th.col-idx, td.col-idx { width: 46px; text-align: center; color: #888780; font-size: 12px; }
  th.col-code, td.col-code { width: 90px; }
  th.col-name, td.col-name { width: 18%; }
  th.col-cause, td.col-cause { width: 27%; }
  th.col-action, td.col-action { width: 26%; }
  th.col-note, td.col-note { width: 16%; }

  tbody tr { border-bottom: 0.5px solid #ebebeb; transition: background 0.1s; }
  tbody tr:last-child { border-bottom: none; }
  tbody tr:hover { background: #fafaf8; }
  tbody tr.checked-row { background: #fffbf0; }
  tbody tr.checked-row:hover { background: #fff7e0; }
  tbody td { padding: 10px 12px; color: #1a1a19; vertical-align: top; line-height: 1.55; word-break: break-word; }

  .cb { width: 15px; height: 15px; cursor: pointer; accent-color: #ba7517; }

  .code { font-family: 'SFMono-Regular', Consolas, monospace; font-size: 12px; font-weight: 500; }

  .badge { display: inline-block; font-size: 11px; padding: 2px 7px; border-radius: 6px; white-space: nowrap; margin-top: 4px; }
  .badge-comm { background: #e6f1fb; color: #0c447c; }
  .badge-job  { background: #eaf3de; color: #27500a; }
  .badge-mem  { background: #faeeda; color: #633806; }
  .badge-hyd  { background: #e1f5ee; color: #085041; }
  .badge-head { background: #faece7; color: #712b13; }
  .badge-spd  { background: #fbeaf0; color: #72243e; }
  .badge-sys  { background: #eeedfe; color: #3c3489; }
  .badge-ink  { background: #f1efe8; color: #444441; }

  .name { font-weight: 500; margin-bottom: 4px; }
  .cause-text { color: #5f5e5a; }
  .note-text  { color: #888780; font-size: 12px; }

  /* floating button area */
  .fab-wrap {
    position: fixed; right: 2rem; bottom: 2rem; z-index: 100;
    display: flex; flex-direction: column; align-items: flex-end; gap: 8px;
  }
  .fab-counter {
    background: #ba7517; color: #fff; font-size: 12px; font-weight: 500;
    padding: 4px 12px; border-radius: 20px;
    opacity: 0; transform: translateY(4px); transition: opacity 0.2s, transform 0.2s;
    pointer-events: none;
  }
  .fab-counter.visible { opacity: 1; transform: translateY(0); }
  .fab-btn {
    display: flex; align-items: center; gap: 8px;
    padding: 13px 24px; font-size: 14px; font-weight: 500;
    border-radius: 50px; border: none; cursor: pointer;
    background: #1a1a19; color: #fff;
    box-shadow: 0 4px 20px rgba(0,0,0,0.22);
    transition: background 0.15s, transform 0.1s, box-shadow 0.15s;
  }
  .fab-btn:hover { background: #2e2e2c; box-shadow: 0 6px 24px rgba(0,0,0,0.28); }
  .fab-btn:active { transform: scale(0.97); }

  @media (max-width: 768px) {
    .container { padding: 1rem 1rem 5rem; }
    th.col-note, td.col-note { display: none; }
    .fab-wrap { right: 1rem; bottom: 1.2rem; }
  }
</style>
</head>
<body>
<div class="container">
  <h1>JET2neo Error List</h1>
  <p class="subtitle">Service Manual Rev 2.5 — Section 6 (Page 30–47)</p>

  <div class="top-bar">
    <input class="search-box" type="text" id="search" placeholder="에러 코드 또는 키워드 검색...">
    <button class="btn-sm" id="btnCheckAll">전체 선택</button>
    <button class="btn-sm" id="btnUncheckAll">선택 해제</button>
  </div>

  <div class="filters" id="filters">
    <button class="filter-btn active" data-cat="all">전체</button>
    <button class="filter-btn" data-cat="comm">통신 오류</button>
    <button class="filter-btn" data-cat="job">작업/스크립트</button>
    <button class="filter-btn" data-cat="mem">메모리</button>
    <button class="filter-btn" data-cat="hyd">유압/점도</button>
    <button class="filter-btn" data-cat="head">프린트헤드</button>
    <button class="filter-btn" data-cat="spd">속도/인쇄</button>
    <button class="filter-btn" data-cat="sys">시스템</button>
    <button class="filter-btn" data-cat="ink">잉크/용제</button>
  </div>

  <div class="count" id="count"></div>

  <div class="mode-banner" id="modeBanner">
    <span>✔ 체크된 항목만 표시하고 있습니다.</span>
    <button class="btn-reset-view" id="btnResetView">전체 보기로 돌아가기</button>
  </div>

  <div class="tbl-wrap">
    <table>
      <thead>
        <tr>
          <th class="col-chk">
            <input type="checkbox" class="cb" id="masterCb" title="현재 보이는 항목 전체 선택/해제">
          </th>
          <th class="col-idx">#</th>
          <th class="col-code">코드</th>
          <th class="col-name">에러명</th>
          <th class="col-cause">원인</th>
          <th class="col-action">조치</th>
          <th class="col-note">비고</th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>
</div>

<!-- floating button -->
<div class="fab-wrap">
  <div class="fab-counter" id="fabCounter">0개 선택됨</div>
  <button class="fab-btn" id="fabBtn">
    <svg width="15" height="15" viewBox="0 0 15 15" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M1.5 3.5h12M1.5 7.5h7.5M1.5 11.5h5" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
    </svg>
    오류 보기
  </button>
</div>

const catLabels = {comm:"통신 오류",job:"작업/스크립트",mem:"메모리",hyd:"유압/점도",head:"프린트헤드",spd:"속도/인쇄",sys:"시스템",ink:"잉크/용제"};
const catBadge  = {comm:"badge-comm",job:"badge-job",mem:"badge-mem",hyd:"badge-hyd",head:"badge-head",spd:"badge-spd",sys:"badge-sys",ink:"badge-ink"};

const checkedSet = new Set();
let currentCat      = "all";
let searchTerm      = "";
let checkedOnlyMode = false;

function getFiltered() {
  return errors.filter((e, i) => {
    if (checkedOnlyMode) return checkedSet.has(i);
    const catMatch  = currentCat === "all" || e.cat === currentCat;
    const q         = searchTerm.toLowerCase();
    const textMatch = !q
      || e.code.toLowerCase().includes(q)
      || e.name.toLowerCase().includes(q)
      || e.cause.toLowerCase().includes(q)
      || e.action.toLowerCase().includes(q);
    return catMatch && textMatch;
  });
}

function render() {
  const tbody    = document.getElementById("tbody");
  const countEl  = document.getElementById("count");
  const filtered = getFiltered();

  countEl.textContent = checkedOnlyMode
    ? "체크된 항목 " + filtered.length + "개"
    : "총 " + filtered.length + "개 항목";

  tbody.innerHTML = filtered.map((e, localIdx) => {
    const gi = errors.indexOf(e);
    const checked = checkedSet.has(gi);
    return `<tr class="${checked ? 'checked-row' : ''}" data-gi="${gi}">
      <td class="col-chk"><input type="checkbox" class="cb row-cb" data-gi="${gi}" ${checked ? 'checked' : ''}></td>
      <td class="col-idx">${localIdx + 1}</td>
      <td class="col-code"><span class="code">${e.code}</span></td>
      <td class="col-name"><div class="name">${e.name}</div><span class="badge ${catBadge[e.cat]}">${catLabels[e.cat]}</span></td>
      <td class="col-cause cause-text">${e.cause}</td>
      <td class="col-action">${e.action}</td>
      <td class="col-note note-text">${e.note}</td>
    </tr>`;
  }).join("");

  // master checkbox state
  const masterCb = document.getElementById("masterCb");
  const allChecked  = filtered.length > 0 && filtered.every(e => checkedSet.has(errors.indexOf(e)));
  const someChecked = filtered.some(e => checkedSet.has(errors.indexOf(e)));
  masterCb.checked       = allChecked;
  masterCb.indeterminate = !allChecked && someChecked;

  // fab counter
  const fabCounter = document.getElementById("fabCounter");
  const n = checkedSet.size;
  fabCounter.textContent = n + "개 선택됨";
  fabCounter.classList.toggle("visible", n > 0);

  // banner
  document.getElementById("modeBanner").classList.toggle("visible", checkedOnlyMode);
}

// row checkbox
document.getElementById("tbody").addEventListener("change", function(e) {
  if (!e.target.classList.contains("row-cb")) return;
  const gi = parseInt(e.target.dataset.gi);
  if (e.target.checked) {
    checkedSet.add(gi);
    e.target.closest("tr").classList.add("checked-row");
  } else {
    checkedSet.delete(gi);
    e.target.closest("tr").classList.remove("checked-row");
  }
  // sync fab counter + master cb without full re-render
  const n = checkedSet.size;
  const fabCounter = document.getElementById("fabCounter");
  fabCounter.textContent = n + "개 선택됨";
  fabCounter.classList.toggle("visible", n > 0);
  const filtered = getFiltered();
  const masterCb = document.getElementById("masterCb");
  const allChecked  = filtered.length > 0 && filtered.every(e2 => checkedSet.has(errors.indexOf(e2)));
  const someChecked = filtered.some(e2 => checkedSet.has(errors.indexOf(e2)));
  masterCb.checked = allChecked;
  masterCb.indeterminate = !allChecked && someChecked;
});

// master checkbox
document.getElementById("masterCb").addEventListener("change", function() {
  getFiltered().forEach(e => {
    const gi = errors.indexOf(e);
    this.checked ? checkedSet.add(gi) : checkedSet.delete(gi);
  });
  render();
});

// check all / uncheck all (global)
document.getElementById("btnCheckAll").addEventListener("click", function() {
  errors.forEach((_, i) => checkedSet.add(i));
  render();
});
document.getElementById("btnUncheckAll").addEventListener("click", function() {
  checkedSet.clear();
  if (checkedOnlyMode) { checkedOnlyMode = false; }
  render();
});

// search
document.getElementById("search").addEventListener("input", function() {
  if (checkedOnlyMode) return;
  searchTerm = this.value;
  render();
});

// category filter
document.getElementById("filters").addEventListener("click", function(e) {
  if (!e.target.classList.contains("filter-btn")) return;
  document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
  e.target.classList.add("active");
  currentCat = e.target.dataset.cat;
  if (checkedOnlyMode) return;
  render();
});

// FAB button
document.getElementById("fabBtn").addEventListener("click", function() {
  if (checkedSet.size === 0) {
    alert("선택된 항목이 없습니다.\n체크박스를 먼저 선택해 주세요.");
    return;
  }
  checkedOnlyMode = true;
  render();
  window.scrollTo({ top: 0, behavior: "smooth" });
});

// reset to full view
document.getElementById("btnResetView").addEventListener("click", function() {
  checkedOnlyMode = false;
  render();
});

render();
</script>
